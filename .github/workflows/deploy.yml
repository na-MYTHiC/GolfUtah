name: Build and deploy GolfUtah

# GitHub Pages can't run a server, so tee times are fetched here and baked
# into the site. That makes the schedule the app's refresh rate: whatever
# cadence this runs at is how stale the data can be.
#
# Five minutes is the floor, not a choice: GitHub won't schedule a
# workflow more often than that. So "as fresh as possible" means making
# every 5-minute tick actually land, and spending it on the days that
# move.
#
# The schedule is tiered, because the days aren't worth the same.
#
#   every 5 minutes    days 1-4   (today through three days out)
#   every 15 minutes   days 5-7
#   every 30 minutes   days 8-10
#
# One cron fires every 5 minutes and works out from the clock which tiers
# are due. Three separate crons would all land on :00 and, with
# cancel-in-progress, spend the hour cancelling each other.
#
# Cost, at 47 courses: 66 day-fetches an hour, against 72 under the
# previous split — so the near tier gained a day *and* the total came
# down, by slowing the far days nobody watches from every 15 minutes to
# every 30. If a booking platform starts rate-limiting, this schedule is
# still the first thing to look at.
#
# Concurrency is capped per platform and scaled to how many courses that
# platform serves (see build-data.ts). Every course is still asked
# exactly once per day per run; the cap only governs how many different
# courses are in flight against one shared host at a time.
#
# Where a run's time goes, measured rather than guessed:
#
#   npm ci + prisma generate   ~40s cold, ~0 on a node_modules cache hit
#   fetch, 4-day tick          ~11s
#   fetch, 10-day tick         ~30s   (was ~60s before the concurrency
#                                      split — one platform, ForeUp,
#                                      was the whole critical path)
#   next build                 19s cold, 6.7s on a .next/cache hit
#
# which leaves the 5-minute window mostly spent on Pages' own deploy.
#
# NOTE: GitHub's scheduled runs are best-effort and get delayed under
# load, especially on free runners. A 5-minute cron does not reliably
# deliver every 5 minutes; treat it as an upper bound.
#
# Free on public repositories: GitHub doesn't bill Actions minutes for
# them, and Pages is only free for public repos too.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never let a slow run overlap the next tick and deploy out of order.
  group: golfutah-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Well under the 5-minute cadence. A run that somehow exceeds this
    # should die rather than sit in the way of the next one — with
    # cancel-in-progress, a job that overruns its window is a job that
    # stops anything from ever deploying.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # node_modules itself, not just npm's download cache. `npm ci`
      # deletes and re-extracts ~850MB every run, and `prisma generate`
      # writes its client into node_modules/.prisma — so caching the
      # directory skips both. The key covers the lockfile and the Prisma
      # schema, the only two things that can invalidate it.
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      # Playwright is a dependency for the local discovery scripts and is
      # never run in CI. Without this, npm ci downloads ~300MB of browsers
      # on every one of the ~288 runs a day — which is most of what stood
      # between a run and finishing inside its 5-minute window.
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Prisma's client is imported for its types even though the static
      # build never touches a database. ~10s, and its output lands inside
      # node_modules, so a cache hit has already done it.
      - run: npx prisma generate
        if: steps.modules.outputs.cache-hit != 'true'

      # Next's build cache. Measured on this project: 19s cold, 6.7s warm.
      # Keyed on the source so a code change rebuilds properly, with
      # prefix restores so a data-only run — which is ~287 of the 288 runs
      # a day — still starts warm.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      # Which day ranges this tick owes a refresh. Days 1-4 every run;
      # days 5-7 on the quarter hours; days 8-10 on the half hours. A push
      # or a manual run refreshes everything, so a deploy always starts
      # from a complete site.
      #
      # The near tier gained a day and the far tiers slowed down, which
      # together came out slightly cheaper than the old split — see the
      # cost note at the top of this file.
      - name: Decide freshness tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "fresh=0-9" >> "$GITHUB_OUTPUT"
          else
            MINUTE=$(date -u +%-M)
            FRESH="0-3"
            # Written as ifs rather than `[ ... ] && ...` because the
            # step runs under `bash -e`, where a false test in a && list
            # is a trap worth not setting.
            if [ $((MINUTE % 15)) -eq 0 ]; then
              FRESH="$FRESH,4-6"
            fi
            if [ $((MINUTE % 30)) -eq 0 ]; then
              FRESH="$FRESH,7-9"
            fi
            echo "tier: minute=$MINUTE fresh=$FRESH"
            echo "fresh=$FRESH" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch tee times
        env:
          # Optional — ratings are omitted when this isn't set.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        # --reuse points at the live site so days this run isn't
        # refetching are carried over rather than lost. Each deploy
        # replaces the whole site, so without it a partial run would
        # publish a site missing seven days of data.
        # --budget stops it starting new fetches after 150s and publishes
        # what it has. A healthy ten-day tick fetches in ~30s, so this
        # only ever bites when a platform is in trouble — and when one is,
        # a site missing a few courses beats a job that hits the timeout
        # and deploys nothing at all.
        run: >
          npx tsx scripts/build-data.ts
          --days 10
          --fresh ${{ steps.tier.outputs.fresh }}
          --budget 150
          --reuse https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Build static site
        env:
          # Pages serves from /<repo>/, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
