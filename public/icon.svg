<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    A ball on a tee — the exact geometry of the Rounds button in
    app/components/rounds-sheet.tsx, drawn on a 24-unit grid and scaled
    up, so the two can never drift apart.

    SIZED FOR ANDROID'S MASK. Adaptive icons are cropped to whatever
    shape the launcher wants — circle, squircle, teardrop — and only the
    centre ~66% of the canvas is guaranteed to survive. At 512 that's a
    circle of radius ~169 around the middle. The artwork is scaled to sit
    inside it, so an earlier version that ran from y=82 to y=470 and lost
    its tee to a circular mask can't happen again.

    Furthest point from centre here is ~157 units, comfortably inside.

    NOT THE PAGE COLOUR. The tile used to be #0b0809, the same near-black
    as the app background, and it disappeared into a dark wallpaper. A
    home screen isn't a surface this app controls, so the icon can't
    assume what it sits on. The ground is now a warm charcoal — same
    family as the app's surfaces, light enough to read as its own object
    against a dark wallpaper. The mark steps up to the brighter crimson
    to hold its contrast against the lighter ground.
  -->
  <defs>
    <!-- A shallow gradient, not a dramatic one. The first attempt ran
         down to #1e181a, and measured against a #121212 wallpaper the
         bottom edge came back at a contrast ratio of 1.07 — the lower
         third of the tile was reintroducing exactly the problem the
         lighter ground was meant to solve. Both ends now clear the
         wallpaper; the gradient is there for depth, not for range. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3336"/>
      <stop offset="100%" stop-color="#2c2528"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- translate to centre, scale up, then shift the mark's own centre
       (12, 12.25 on its grid) back to the origin. Stroke width is given
       in grid units so it scales with everything else. -->
  <g
    transform="translate(256 256) scale(16) translate(-12 -12.25)"
    fill="none"
    stroke="#f0325a"
    stroke-width="1.8"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="8" r="4.5"/>
    <path d="M8.5 14.5h7L12 21z"/>
  </g>
</svg>
