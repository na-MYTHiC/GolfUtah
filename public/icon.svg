<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    A ball on a tee — the same mark as the Rounds button, so the icon on
    the home screen and the control inside the app read as one thing.

    Strokes rather than fills, matching the app's line icons, and heavy
    enough that it still reads at 76px where a thinner outline would grey
    out into mush.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b0809"/>
  <circle cx="256" cy="215" r="200" fill="url(#glow)"/>

  <g fill="none" stroke="#dc143c" stroke-width="30" stroke-linejoin="round">
    <circle cx="256" cy="186" r="104"/>
    <!-- The tee: a shallow cup under the ball tapering to a point. -->
    <path d="M 174 328 h 164 L 256 470 Z"/>
  </g>

  <!-- Dimples, hinted rather than drawn out. They disappear below about
       120px, which is fine — the silhouette is what identifies it. -->
  <g fill="#f0325a" opacity="0.55">
    <circle cx="222" cy="160" r="13"/>
    <circle cx="272" cy="146" r="13"/>
    <circle cx="292" cy="196" r="13"/>
    <circle cx="238" cy="212" r="13"/>
  </g>
</svg>
