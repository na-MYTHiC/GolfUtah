<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- One iron, drawn vertically then rotated into the X. Grip at the
         top, blade at the bottom, so the pair crosses mid-shaft the way
         a crossed-clubs emblem does. -->
    <g id="iron">
      <rect x="-11" y="-168" width="22" height="86" rx="11" fill="#8f0d27"/>
      <rect x="-5.5" y="-96" width="11" height="212" rx="5.5" fill="#dc143c"/>
      <path d="M -5 106 L -58 138 L -44 166 L -5 148 Z" fill="#dc143c"/>
      <path d="M -5 106 L -58 138 L -53 148 L -5 122 Z" fill="#f0325a" opacity="0.5"/>
    </g>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b0809"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>

  <g transform="translate(256 250)">
    <use href="#iron" transform="rotate(28)"/>
    <use href="#iron" transform="rotate(-28) scale(-1 1)"/>
  </g>
</svg>
