<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    A ball on a tee — the exact geometry of the Rounds button in
    app/components/rounds-sheet.tsx, drawn on a 24-unit grid and scaled
    up, so the two can never drift apart.

    SIZED FOR ANDROID'S MASK. Adaptive icons are cropped to whatever
    shape the launcher wants — circle, squircle, teardrop — and only the
    centre ~66% of the canvas is guaranteed to survive. At 512 that's a
    circle of radius ~169 around the middle. The artwork is scaled to sit
    inside it, so an earlier version that ran from y=82 to y=470 and lost
    its tee to a circular mask can't happen again.

    Furthest point from centre here is ~157 units, comfortably inside.

    NOT THE PAGE COLOUR, AND FLAT. Two things this tile has to get right,
    both learned the hard way.

    It was #0b0809 once — the app's own page colour — and it vanished into
    a dark wallpaper. A home screen isn't a surface this app controls, so
    the icon can't assume what it sits on. It needs to be lighter than the
    page is.

    Then it was a gradient, and warm. The warmth read as brown rather than
    black; the ground is now the same cool near-black family as the app's
    surfaces, a few steps up the ramp so it still separates from a dark
    wallpaper. Flat rather than graded because AniLog's icon is, and for
    its stated reason: solid shapes survive Safari's lossy icon
    rasterization, gradients and opacity tricks don't.

    The mark stays on the brighter crimson — it's carrying all of the
    colour now that the ground has none.
  -->
  <rect width="512" height="512" rx="112" fill="#2b2b36"/>

  <!-- translate to centre, scale up, then shift the mark's own centre
       (12, 12.25 on its grid) back to the origin. Stroke width is given
       in grid units so it scales with everything else. -->
  <g
    transform="translate(256 256) scale(16) translate(-12 -12.25)"
    fill="none"
    stroke="#f0325a"
    stroke-width="1.8"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="8" r="4.5"/>
    <path d="M8.5 14.5h7L12 21z"/>
  </g>
</svg>
